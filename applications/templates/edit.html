<!DOCTYPE html>
<html>
<head>
    <title>Edit Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">Edit Application</h2>

    <form method="POST">
        {% csrf_token %}

        <!-- Company -->
        <div class="mb-3">
            <label class="form-label">Company</label>
            <input type="text" name="company" class="form-control" value="{{ app.company }}" required>
        </div>

        <!-- Role -->
        <div class="mb-3">
            <label class="form-label">Role</label>
            <input type="text" name="role" class="form-control" value="{{ app.role }}" required>
        </div>

        <!-- Status -->
        <div class="mb-3">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
                <option {% if app.status == "Applied" %}selected{% endif %}>Applied</option>
                <option {% if app.status == "Interview" %}selected{% endif %}>Interview</option>
                <option {% if app.status == "Rejected" %}selected{% endif %}>Rejected</option>
                <option {% if app.status == "Offer" %}selected{% endif %}>Offer</option>
            </select>
        </div>

        <!-- Date -->
        <div class="mb-3">
            <label class="form-label">Applied Date</label>
            <input type="date" name="applied_date" class="form-control" value="{{ app.applied_date }}" required>
        </div>

        <!-- Notes -->
        <div class="mb-3">
            <label class="form-label">Notes</label>
            <textarea name="notes" class="form-control">{{ app.notes }}</textarea>
        </div>

        <!-- Buttons -->
        <button type="submit" class="btn btn-success">Save Changes</button>
        <a href="/" class="btn btn-secondary">Cancel</a>

    </form>

</div>

</body>
</html>
